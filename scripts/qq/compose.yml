name: lg-qq-llbot
services:
  pmhq:
    image: ${PMHQ_IMAGE:?Run pnpm qq:prepare first}
    init: true
    privileged: true
    restart: unless-stopped
    environment:
      AUTO_LOGIN_QQ: ${QQ_BOT_ID:?Set the independent bot account}
      PMHQ_AUTH_TOKEN: ${PMHQ_AUTH_TOKEN:?Set your LLBot Auth Token in .env.qq}
      TZ: Asia/Shanghai
    volumes:
      - ../../data/qq-llbot/qq:/root/.config/QQ
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  llbot:
    image: ${LLBOT_IMAGE:?Run pnpm qq:prepare first}
    init: true
    restart: unless-stopped
    environment:
      PROTOCOL_MODE: pmhq
      PMHQ_HOST: pmhq
      PMHQ_PORT: "13000"
      WEBUI_PORT: "3080"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${LLBOT_WEBUI_PORT:-13080}:3080"
      - "127.0.0.1:${QQ_ONEBOT_PORT:-13001}:3001"
    volumes:
      - ../../data/qq-llbot/data:/app/llbot/data
      - ../../data/qq-llbot/data/default_config.json:/app/llbot/default_config.json
    logging:
      options:
        max-size: "10m"
        max-file: "3"
