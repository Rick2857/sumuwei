name: lg-postgresql-production
services:
  postgres:
    image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    container_name: lg-postgresql-production
    # ⚠️ 这里曾是 `restart: "no"`：WP2 刻意选的，理由是"启动 Docker 引擎会把服务自动拉起、
    # 而它的宿主核心并没有在跑"（见 PostgreSQL-Migration-WP2-Handoff.md §0/§2③），
    # 并把"生产重启策略"显式留给 WP6 裁定。**WP6 从未裁定**（Runbook §1.3 只把它写成
    # 操作者要自己核对的前置条件，`Known-Limitations` 里也没有对应条目）。
    #
    # ⏩ **2026-10-15 用户裁定：改为 `unless-stopped`**（事故驱动，见下方记录）：
    #   2026-10-15 20:12:45 Docker Desktop 重启 ⇒ 因本字段，**生产库留在地上没回来**，
    #   而 NapCat（`unless-stopped`）自己回来了 ⇒ 两者不一致，`pnpm qq:start` 以
    #   `lg_bridge_exit_1` 失败（核心首条 SQL 读回身份时连不上 127.0.0.1:55432）。
    #   恢复读数：`docker start` 后 redo→ready、`pnpm migrate` schema v22 无待应用项、
    #   `postgresql-cutover-probe --db sumuwei` ok（554/478/29/5），**未丢块**。
    #
    # 为什么"库自动起来"不违反单持有：PG 后端的写资格锁（`PG-G03`）由**核心**持有，
    # 容器自己起来**不占锁、不写库**，只是一个可读的待机服务。
    # 与 NapCat 那种"主人不在场却对外应答"不同，库待机的后果只是内存占用。
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: ${LG_PG_BOOTSTRAP_USER:-lg_bootstrap}
      POSTGRES_PASSWORD: ${LG_PG_BOOTSTRAP_PASSWORD:?required}
      POSTGRES_DB: ${LG_PG_BOOTSTRAP_DB:-lg_trial}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      LG_PG_MIGRATE_PASSWORD: ${LG_PG_MIGRATE_PASSWORD:?required}
      LG_PG_RUNTIME_PASSWORD: ${LG_PG_RUNTIME_PASSWORD:?required}
      LG_PG_READONLY_PASSWORD: ${LG_PG_READONLY_PASSWORD:?required}
      LG_PG_TEST_PASSWORD: ${LG_PG_TEST_PASSWORD:?required}
    volumes:
      - production-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - .:/opt/lg:ro
    command: [postgres, -c, fsync=on, -c, synchronous_commit=on, -c, log_connections=on, -c, log_disconnections=on]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${LG_PG_BOOTSTRAP_USER:-lg_bootstrap} -d ${LG_PG_BOOTSTRAP_DB:-lg_trial}"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  production-data:
    name: lg-postgresql-production-20261014
