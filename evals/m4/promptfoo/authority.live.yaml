    vars:
      suiteId: "authority"
      live: true
      caseCount: 1
      caseIds: "M4X-010"
    assert:
      - type: javascript
        value: "output.length > 0"
      - type: javascript
        value: "(() => { const p = JSON.parse(output); return { pass: p.live === true, score: p.live === true ? 1 : 0, reason: p.live === true ? '档位正确' : `档位错：期望 live=true，实际 ${p.live}（这一轮量的不是它声称的那一档）` } })()"
      - type: javascript
        value: "(() => { const p = JSON.parse(output); const want = 1; return { pass: p.caseCount === want, score: p.caseCount === want ? 1 : 0, reason: p.caseCount === want ? `${want} 条用例` : `期望 ${want} 条用例，实际 ${p.caseCount} 条（用例表与配置漂移了）` } })()"
