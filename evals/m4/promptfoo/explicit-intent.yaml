      suiteId: "explicit-intent"

prompts:
  - "{{suiteId}}"

tests:
  - description: "explicit-intent · offline — 显式意图理解（记住 / 忘掉 / 纠正）"
    vars:
      suiteId: "explicit-intent"
      live: false
      caseCount: 1
      caseIds: "M4X-031"
    assert:
      - type: javascript
        value: "output.length > 0"
      - type: javascript
        value: "(() => { const p = JSON.parse(output); return { pass: p.live === false, score: p.live === false ? 1 : 0, reason: p.live === false ? '档位正确' : `档位错：期望 live=false，实际 ${p.live}（这一轮量的不是它声称的那一档）` } })()"
      - type: javascript
        value: "(() => { const p = JSON.parse(output); const want = 1; return { pass: p.caseCount === want, score: p.caseCount === want ? 1 : 0, reason: p.caseCount === want ? `${want} 条用例` : `期望 ${want} 条用例，实际 ${p.caseCount} 条（用例表与配置漂移了）` } })()"
      - type: javascript
        value: "(() => { const p = JSON.parse(output); const real = p.caseCount - (p.vacuous || 0); return { pass: real > 0, score: real > 0 ? 1 : 0, reason: real > 0 ? `${real}/${p.caseCount} 条有实际判据（${p.vacuous || 0} 条空过）` : `整档都是空的绿：${p.caseCount} 条用例全部空过，这一档什么都没验证到` } })()"
      - type: javascript
        value: "(() => { const p = JSON.parse(output); return { pass: p.failed === 0, score: p.failed === 0 ? 1 : 0, reason: p.failed === 0 ? `${p.passed}/${p.caseCount} 用例通过` : `${p.failed} 条用例未通过：` + p.failedCases.map(c => c.caseId + ' → ' + c.reasons.join('；')).join(' | ') } })()"
      - type: javascript
        value: "(() => { const p = JSON.parse(output); return { pass: p.ok === true, score: p.ok ? 1 : 0, reason: p.ok ? '套件整体 ok' : '套件整体 ok=false（见失败用例）' } })()"
    metadata:
      suite: "explicit-intent"
      title: "显式意图理解（记住 / 忘掉 / 纠正）"
      layer: "deterministic"
      caseIds: "M4X-031"
